[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "floradeck-ml"
version = "0.1.0"
description = "FloraDeck dataset pipeline: iNaturalist selection, download, cleaning and split"
requires-python = ">=3.13"
dependencies = [
    "Pillow>=11",
    "numpy>=2.1",
]

[project.scripts]
floradeck-ml = "floradeck_ml.cli:main"

[tool.setuptools]
packages = ["floradeck_ml"]
